# Keep the original scheme when the TLS proxy (proxy/) sits in front.
map $http_x_forwarded_proto $svidat_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    root /usr/share/nginx/html;

    # netCDF/avatar uploads.
    client_max_body_size 1g;

    # Same contract as vite.config.ts: strip /api and forward to the backend.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $svidat_proto;
        proxy_read_timeout 300s;
    }

    # Hashed build assets never change; index.html must not be cached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routes (/plot, /profile, ...) fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
